name: Update Repo Count Badge

on:
  schedule:
    - cron: "0 6 * * *"   # una volta al giorno, 06:00 UTC
  workflow_dispatch:        # avvio manuale

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch public repo count
        id: repos
        run: |
          COUNT=$(curl -s "https://api.github.com/users/${{ github.repository_owner }}" | jq '.public_repos')
          if ! [[ "$COUNT" =~ ^[0-9]+$ ]]; then
            echo "GitHub API did not return a valid number, aborting." >&2
            exit 1
          fi
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Update README badge
        run: |
          sed -i -E "s#(PUBLIC%20REPOS-)[0-9]+(-00ff41)#\1${{ steps.repos.outputs.count }}\2#" README.md

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet README.md; then
            git add README.md
            git commit -m "chore: update public repos badge to ${{ steps.repos.outputs.count }} [skip ci]"
            git push
          else
            echo "No changes needed."
          fi
